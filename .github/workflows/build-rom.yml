name: Build Slate Dev ROM

# Manual only: Actions tab > Build Slate Dev ROM > Run workflow.
# Builds the ROM source committed in the slate-rom/ folder (not a fresh template).
# Secret needed: ROM_SIGNING_KEY = full text of the DEV private key (slatedev.key.pem).
# Never print the key or turn on shell tracing (set -x) in this file: the repo is public.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "ROM version (blank = 0.1.<run number>)"
        required: false
      security_version:
        description: "Security version, must only go up (blank = run number)"
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    # The Makefile uses xcrun and the iOS SDK, so it needs a Mac.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out Slate
        uses: actions/checkout@v4

      - name: Make sure the ROM source is there
        run: |
          test -f slate-rom/Makefile || { echo "slate-rom/Makefile is missing. Commit the generated template into slate-rom/ first."; exit 1; }

      - name: Write the dev signing key
        env:
          ROM_KEY: ${{ secrets.ROM_SIGNING_KEY }}
        run: |
          mkdir -p ~/.config/nyxian/romkey
          printf '%s\n' "$ROM_KEY" > ~/.config/nyxian/romkey/slatedev.key.pem
          chmod 600 ~/.config/nyxian/romkey/slatedev.key.pem

      - name: Set the dev identity and version
        env:
          ROM_ID: dev.alloycore.slatedev
          ROM_NAME: Slate Dev
          ROM_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
          ROM_SECURITY: ${{ inputs.security_version || github.run_number }}
        run: |
          python3 - << 'PY'
          import os, plistlib
          path = 'slate-rom/manifest.plist'
          with open(path, 'rb') as f:
              manifest = plistlib.load(f)
          manifest['NXRomIdentifier'] = os.environ['ROM_ID']
          manifest['NXRomName'] = os.environ['ROM_NAME']
          manifest['NXRomVersion'] = os.environ['ROM_VERSION']
          manifest['NXRomSecurityVersion'] = int(os.environ['ROM_SECURITY'])
          with open(path, 'wb') as f:
              plistlib.dump(manifest, f)
          print(manifest['NXRomIdentifier'], manifest['NXRomVersion'], 'security', manifest['NXRomSecurityVersion'])
          PY

      - name: Build and sign
        run: |
          cd slate-rom
          make ROM_SIGNING_KEY="$HOME/.config/nyxian/romkey/slatedev.key.pem"

      - name: Show the ROM details
        run: |
          python3 slate-rom/RomGen.py info slate-rom/rom.zip || true
          shasum -a 256 slate-rom/rom.zip

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: Slate-Dev-ROM
          path: slate-rom/rom.zip

      - name: Remove the key
        if: always()
        run: rm -f ~/.config/nyxian/romkey/slatedev.key.pem
