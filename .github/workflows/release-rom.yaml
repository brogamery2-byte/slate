name: Build Slate Release ROM

# Manual only: Actions tab > Build Slate Release ROM > Run workflow.
# Runs in the GitHub "release" environment, which should require your approval
# and only allow the main branch. The environment secret ROM_RELEASE_KEY holds
# the full text of the RELEASE private key.
# This key signs the real ROM (dev.alloycore.slate). After the build, register
# the build in "Signed releases" on the Developer Portal so devices accept it.
# Never print the key or turn on shell tracing (set -x) in this file: the repo is public.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "ROM version, e.g. 1.0.0"
        required: true
      security_version:
        description: "Security version: a whole number higher than the last release"
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    # RomGen's Makefile uses xcrun and the iOS SDK, so it needs a Mac.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out Nyxian (with submodules)
        uses: actions/checkout@v4
        with:
          repository: emexlab/Nyxian
          submodules: recursive
          path: nyxian

      - name: Write the release signing key
        env:
          ROM_KEY: ${{ secrets.ROM_RELEASE_KEY }}
        run: |
          mkdir -p ~/.config/nyxian/romkey
          printf '%s\n' "$ROM_KEY" > ~/.config/nyxian/romkey/slate.key.pem
          chmod 600 ~/.config/nyxian/romkey/slate.key.pem

      - name: Generate the ROM template
        run: |
          ROMGEN=$(find nyxian -name RomGen.py | head -n 1)
          echo "Using $ROMGEN"
          python3 "$ROMGEN" generate nyxian slate-build \
            --identifier dev.alloycore.slate \
            --name "Slate" \
            --key ~/.config/nyxian/romkey/slate.key.pem

      - name: Set version numbers
        env:
          ROM_VERSION: ${{ inputs.version }}
          ROM_SECURITY: ${{ inputs.security_version }}
        run: |
          python3 - << 'PY'
          import os, plistlib
          path = 'slate-build/manifest.plist'
          with open(path, 'rb') as f:
              manifest = plistlib.load(f)
          manifest['NXRomVersion'] = os.environ['ROM_VERSION']
          manifest['NXRomSecurityVersion'] = int(os.environ['ROM_SECURITY'])
          with open(path, 'wb') as f:
              plistlib.dump(manifest, f)
          print('version', manifest['NXRomVersion'], 'security', manifest['NXRomSecurityVersion'])
          PY

      - name: Build and sign
        run: |
          cd slate-build
          make

      - name: Show the ROM details
        run: |
          python3 slate-build/RomGen.py info slate-build/rom.zip || true
          echo "SHA-256 of rom.zip (check what the portal asks for when you register the build):"
          shasum -a 256 slate-build/rom.zip

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: Slate-Release-ROM
          path: slate-build/rom.zip

      - name: Remove the key
        if: always()
        run: rm -f ~/.config/nyxian/romkey/slate.key.pem
